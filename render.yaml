services:
  # Backend API (FastAPI)
  - type: web
    name: documind-api
    runtime: python
    plan: free
    buildCommand: |
  # Upgrade pip to the latest
  pip install --upgrade pip
  # Set Rust and Cargo home to writable directories
  export RUSTUP_HOME=$HOME/.rustup
  export CARGO_HOME=$HOME/.cargo
  # Install Rust for building from source
  curl https://sh.rustup.rs -sSf | sh -s -- -y
  export PATH="$RUSTUP_HOME/bin:$PATH"
  # Install Python dependencies, but force building psycopg2 from source
  pip install --no-binary psycopg2 -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: documind-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: documind
      - key: PINECONE_ENVIRONMENT
        value: us-east-1-aws
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_PROJECT
        value: documind
      - key: UPLOAD_DIR
        value: ./uploads
      - key: APP_NAME
        value: DocuMind
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://documind-frontend.onrender.com"

  # Frontend (Static Site) - static sites don't use "plan" field
  - type: web
    name: documind-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  # Redis (free tier requires ipAllowList)
  - type: redis
    name: documind-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: documind-db
    databaseName: documind
    user: documind
    plan: free